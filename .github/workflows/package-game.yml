name: Build game packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-22.04
            platform: Linux
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up OpenJDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13'
          architecture: x64
      - name: Compile, verify and package
        run: python tools/package_game.py
      - name: Include corresponding Java runtime source
        shell: python
        run: |
          import hashlib, json, pathlib, shutil, urllib.request
          meta = json.loads(pathlib.Path('tools/windows-runtime.json').read_text())
          dest = pathlib.Path('dist') / meta['source_url'].rsplit('/', 1)[-1]
          with urllib.request.urlopen(meta['source_url'], timeout=60) as src, dest.open('wb') as out:
              shutil.copyfileobj(src, out)
          assert hashlib.sha256(dest.read_bytes()).hexdigest() == meta['source_sha256']
      - name: Upload packages for manual testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LastStandinNote-${{ matrix.platform }}-x64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
